<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="ARSALAI Flächenradar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ad395"/>
      <stop offset="1" stop-color="#0e9f6e"/>
    </linearGradient>
  </defs>
  <!-- icon: location pin with a charging bolt, radar sweep arcs -->
  <g transform="translate(8,8)">
    <rect width="80" height="80" rx="20" fill="#0d2f4a"/>
    <!-- radar arcs -->
    <path d="M52 20a22 22 0 0 1 10 14" fill="none" stroke="#2ad395" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    <path d="M56 11a31 31 0 0 1 14 20" fill="none" stroke="#2ad395" stroke-width="3" stroke-linecap="round" opacity=".3"/>
    <!-- pin -->
    <path d="M36 14c-11.6 0-21 9-21 20.4C15 49.5 36 70 36 70s21-20.5 21-35.6C57 23 47.6 14 36 14z" fill="url(#g)"/>
    <!-- bolt -->
    <path d="M38.5 21.5 28 37.5h7.5l-2 11.5L44.5 32.5H37l1.5-11z" fill="#0d2f4a"/>
  </g>
  <!-- wordmark -->
  <text x="104" y="48" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="#0d2f4a">ARSALAI</text>
  <text x="105" y="74" font-family="'IBM Plex Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="6.2" fill="#0e9f6e">FLÄCHENRADAR</text>
</svg>
